<script>
(()=>{
const ROOMS=['AB101','AB102','AB103','AB104','AB105'];
const SLOTS=[{start:'09:00',end:'10:00',label:'09:00–10:00'},{start:'10:00',end:'11:00',label:'10:00–11:00'},{start:'11:00',end:'12:00',label:'11:00–12:00'},{start:'12:00',end:'13:00',label:'12:00–13:00'},{start:'14:00',end:'15:00',label:'14:00–15:00'},{start:'15:00',end:'16:00',label:'15:00–16:00'}];
const USERS={
 T001:{password:'teacher123',role:'teacher',name:'Dr. Amit Sharma',section:null},
 T002:{password:'teacher123',role:'teacher',name:'Prof. Neha Rao',section:null},
 T003:{password:'teacher123',role:'teacher',name:'Dr. K. Mehta',section:null},
 T004:{password:'teacher123',role:'teacher',name:'Prof. P. Singh',section:null},
 T005:{password:'teacher123',role:'teacher',name:'Dr. R. Iyer',section:null},
 T006:{password:'teacher123',role:'teacher',name:'Prof. S. Khan',section:null},
 T007:{password:'teacher123',role:'teacher',name:'Dr. M. Joshi',section:null},
 T008:{password:'teacher123',role:'teacher',name:'Prof. A. Das',section:null},
 T009:{password:'teacher123',role:'teacher',name:'Dr. V. Patel',section:null},
 T010:{password:'teacher123',role:'teacher',name:'Prof. N. Gupta',section:null},
 T011:{password:'teacher123',role:'teacher',name:'Dr. T. Rao',section:null},
 T012:{password:'teacher123',role:'teacher',name:'Prof. J. Shah',section:null},
 S001:{password:'student123',role:'student',name:'Student CSE-A',section:'CSE-A'},
 S002:{password:'student123',role:'student',name:'Student CSE-B',section:'CSE-B'},
 S003:{password:'student123',role:'student',name:'Student CSE-C',section:'CSE-C'},
 S004:{password:'student123',role:'student',name:'Student CSE-DSA',section:'CSE-DSA'},
 S005:{password:'student123',role:'student',name:'Student ECE-B',section:'ECE-B'},
 S006:{password:'student123',role:'student',name:'Student ECE-IoT',section:'ECE-IoT'}
};
const baseDate='2026-10-19';
const addDays=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return iso(x)};
const iso=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const dayName=d=>new Date(d+'T12:00:00').toLocaleDateString('en-IN',{weekday:'long'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=()=>{
 // A deliberately busy sample campus timetable: most room/slot cells are occupied,
 // while a small number stay free so rescheduling can still be demonstrated.
 const teachers=[
  ['T001','Dr. Amit Sharma'],['T002','Prof. Neha Rao'],['T003','Dr. K. Mehta'],['T004','Prof. P. Singh'],
  ['T005','Dr. R. Iyer'],['T006','Prof. S. Khan'],['T007','Dr. M. Joshi'],['T008','Prof. A. Das'],
  ['T009','Dr. V. Patel'],['T010','Prof. N. Gupta'],['T011','Dr. T. Rao'],['T012','Prof. J. Shah']
 ];
 const subjects=['Data Structures','Engineering Physics','Mathematics','Programming in C++','Digital Logic','Database Systems','Computer Networks','Discrete Mathematics','Operating Systems','Web Development','Electronics','Communication Skills'];
 const sections=['CSE-A','CSE-B','CSE-C','CSE-DSA','ECE-B','ECE-IoT'];
 const rows=[];let serial=1;
 for(let day=0;day<6;day++){
  for(let slot=0;slot<SLOTS.length;slot++){
   // Keep 4 rooms occupied in most slots and all 5 occupied in two daily slots.
   const count=(slot===1||slot===4)?5:4;
   for(let r=0;r<count;r++){
    const teacherIndex=(r+slot*4+day*3)%teachers.length;
    const sectionIndex=(r+slot*5+day*2)%sections.length;
    const room=ROOMS[(r+day+slot)%ROOMS.length];
    rows.push({
     id:'C'+serial++,subject:subjects[(teacherIndex+slot+day)%subjects.length],
     teacherId:teachers[teacherIndex][0],teacher:teachers[teacherIndex][1],section:sections[sectionIndex],
     date:addDays(baseDate,day),start:SLOTS[slot].start,end:SLOTS[slot].end,room,status:'Scheduled',history:[]
    });
   }
  }
 }
 return rows;
};
let state={user:null,tab:'dashboard',classes:[],notifications:[],activity:[],matrixDate:baseDate,weekStart:baseDate,search:'',filterDay:'all',modal:null,toastTimer:null};
function load(){try{let s=JSON.parse(localStorage.getItem('campusslot-demo-v4')||'null');if(s&&Array.isArray(s.classes)){state.classes=s.classes;state.notifications=s.notifications||[];state.activity=s.activity||[];return}}catch{} state.classes=seed();state.notifications=[];state.activity=[];save()}
function save(){try{localStorage.setItem('campusslot-demo-v4',JSON.stringify({classes:state.classes,notifications:state.notifications,activity:state.activity}))}catch{}}
function notify(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.classList.add('hidden'),3000)}
function slotLabel(c){return `${c.start}–${c.end}`}
function active(c){return c.status!=='Cancelled'}
function overlaps(a,b){return a.start<b.end&&b.start<a.end}
function conflicts(c,date,start,end,room){return state.classes.filter(x=>x.id!==c.id&&active(x)&&x.date===date&&overlaps({start,end},x)).filter(x=>x.room===room||x.teacherId===c.teacherId||x.section===c.section)}
function getOptions(c,date){let out=[];for(let sl of SLOTS){let blockedTeacher=state.classes.some(x=>x.id!==c.id&&active(x)&&x.date===date&&x.teacherId===c.teacherId&&overlaps(sl,x));let blockedSection=state.classes.some(x=>x.id!==c.id&&active(x)&&x.date===date&&x.section===c.section&&overlaps(sl,x));if(blockedTeacher||blockedSection)continue;for(let room of ROOMS){let blockedRoom=state.classes.some(x=>x.id!==c.id&&active(x)&&x.date===date&&x.room===room&&overlaps(sl,x));if(!blockedRoom)out.push({date,start:sl.start,end:sl.end,room})}}return out}
function currentWeekDates(start){return Array.from({length:6},(_,i)=>addDays(start,i))}
function weekStartFor(d){let x=new Date(d+'T12:00:00');let day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return iso(x)}
function render(){const root=document.getElementById('root');if(!state.user){root.innerHTML=loginHTML();bindLogin();return}if(state.user.role!=='teacher'&&state.tab==='matrix')state.tab='dashboard';root.innerHTML=appHTML();bindApp();if(state.tab==='dashboard')setMilestone('schedule',true);if(state.tab==='matrix')setMilestone('room',true)}
function loginHTML(){return `<div class="loginpage"><section class="loginhero"><div class="brand"><div class="logo">C</div><div>CampusSlot<small>IIIT NAGPUR · ROOM INTELLIGENCE</small></div></div><h1>Every room.<br>Every slot.<br><span style="color:#ff8a24">In sync.</span></h1><p>A smarter way to manage classroom schedules. Find available rooms, prevent timetable collisions, and keep every section informed.</p><div class="featurelist"><div>✓ &nbsp; Live room availability matrix</div><div>✓ &nbsp; Collision-aware rescheduling</div><div>✓ &nbsp; Instant demo notifications</div></div></section><section class="loginbox"><form class="loginform" id="loginForm"><div class="eyebrow">Welcome to CampusSlot</div><h2>Sign in to your campus</h2><p>Enter your campus account details to continue.</p><div class="field"><label for="loginId">Login ID</label><input id="loginId" autocomplete="username" placeholder="Enter teacher T001–T012 or student S001–S006" required></div><div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter password" required></div><div class="field"><label for="loginRole">Login as</label><select id="loginRole"><option value="teacher">Teacher</option><option value="student">Student</option></select></div><div id="loginError" class="error"></div><button class="primary" type="submit" id="signInButton">Sign in →</button><div class="footnote">Demo prototype · changes are saved in this browser only.</div></form></section></div>`}
function performLogin(){const id=document.getElementById('loginId').value.trim().toUpperCase();const pw=document.getElementById('loginPassword').value;const role=document.getElementById('loginRole').value;const u=USERS[id];const err=document.getElementById('loginError');if(!u||u.password!==pw||u.role!==role){err.textContent='Unable to sign in. Check your login ID, password, and selected account type.';return false}state.user={id,...u};state.tab='dashboard';state.weekStart=weekStartFor(baseDate);render();return false}
function bindLogin(){const form=document.getElementById('loginForm');form.addEventListener('submit',e=>{e.preventDefault();performLogin()});document.getElementById('signInButton').addEventListener('click',e=>{e.preventDefault();performLogin()});document.querySelectorAll('[data-fill]').forEach(b=>b.onclick=()=>{let t=b.dataset.fill;document.getElementById('loginId').value=t==='teacher'?'T001':'S001';document.getElementById('loginPassword').value=t==='teacher'?'teacher123':'student123';document.getElementById('loginRole').value=t;document.getElementById('loginError').textContent=''})}
function navItem(id,icon,label){return `<button class="nav ${state.tab===id?'active':''}" data-tab="${id}"><span class="ico">${icon}</span>${label}${id==='notifications'&&unreadCount()?` <span class="pill cancelled">${unreadCount()}</span>`:''}</button>`}
function appHTML(){let u=state.user;return `<div class="app"><header class="topbar"><div class="brand"><div class="logo">C</div><div>CampusSlot<small>CLASSROOM SCHEDULING</small></div></div><div class="userbar"><div class="avatar">${esc(u.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><div class="usertext"><strong>${esc(u.name)}</strong><div style="font-size:11px;color:var(--muted)">${u.role==='teacher'?'Teacher account · '+u.id:'Student account · '+u.id+' · '+u.section}</div></div><button class="outline small" id="logout">Log out</button></div></header><div class="layout"><aside><div class="navlabel">WORKSPACE</div>${navItem('dashboard','▦','Dashboard')}${u.role==='teacher'?navItem('matrix','▤','Room Availability'):''}${navItem('notifications','♧','Notifications')}${navItem('activity','↻','Activity History')}</aside><main class="main">${state.tab==='dashboard'?dashboardHTML():state.tab==='matrix'?matrixHTML():state.tab==='notifications'?notificationsHTML():activityHTML()}</main></div>${state.modal?modalHTML():''}</div>`}
function visibleClasses(){let dates=currentWeekDates(state.weekStart);let list=state.classes.filter(c=>dates.includes(c.date));if(state.user.role==='teacher')list=list.filter(c=>c.teacherId===state.user.id);else list=list.filter(c=>c.section===state.user.section);if(state.filterDay!=='all')list=list.filter(c=>dayName(c.date)===state.filterDay);if(state.search){let q=state.search.toLowerCase();list=list.filter(c=>[c.subject,c.room,c.section,c.teacher,c.status,c.date].some(x=>String(x).toLowerCase().includes(q)))}return list.sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start))}
function dashboardHTML(){let u=state.user,classes=visibleClasses(),upcoming=classes.filter(c=>c.status==='Scheduled').length,cancelled=classes.filter(c=>c.status==='Cancelled').length;let dates=currentWeekDates(state.weekStart);let next=classes.filter(c=>c.status==='Scheduled').sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start))[0];let roomCount=new Set(classes.filter(c=>c.status==='Scheduled').map(c=>c.room)).size;return `<div class="bento-dashboard"><section class="bento-hero"><div class="hero-copy"><div class="eyebrow">${u.role==='teacher'?'TEACHER WORKSPACE':'STUDENT WORKSPACE'} · CAMPUSSLOT</div><h1>Good ${new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening'}, ${esc(u.name.split(' ')[1]||u.name)} <span class="wave">✦</span></h1><p>${u.role==='teacher'?'Your campus day, organized. Manage classes and find conflict-free rooms.':'Your section timetable and class updates, all in one place.'}</p><div class="hero-pills"><span>● Schedule synced in this browser</span><span>◈ ${u.role==='teacher'?'Room intelligence enabled':'Section view'}</span></div></div><div class="hero-orbit" aria-hidden="true"><div class="orbit-ring ring-one"></div><div class="orbit-ring ring-two"></div><div class="orbit-core">CS<span>SPACE · TIME · ROOMS</span></div><i class="orbit-dot dot-one"></i><i class="orbit-dot dot-two"></i><i class="orbit-dot dot-three"></i></div></section><section class="liquid-control"><div><div class="onboard-title"><span class="badge-orb">✦</span><div><h3>Your CampusSlot launch path</h3><p>Explore the workspace and unlock your demo milestones.</p></div></div><svg class="path-progress" viewBox="0 0 320 65" role="img" aria-label="Onboarding milestone progress"><path class="track" d="M14 33 C54 33 58 14 96 20 S142 52 180 33 S235 13 306 33"/><path id="milestonePath" class="active" d="M14 33 C54 33 58 14 96 20 S142 52 180 33 S235 13 306 33" style="stroke-dashoffset:300"/><circle data-node="0" cx="14" cy="33" r="7"/><circle data-node="1" cx="96" cy="20" r="7"/><circle data-node="2" cx="180" cy="33" r="7"/><circle data-node="3" cx="306" cy="33" r="7"/></svg><div class="progress-meta"><span id="milestoneCount">0 of 4 milestones</span><span>Demo explorer</span></div><div class="milestones"><button class="milestone" data-milestone="login">Explore dashboard</button><button class="milestone" data-milestone="schedule">Review timetable</button><button class="milestone" data-milestone="room">Check room slots</button><button class="milestone" data-milestone="reschedule">Try rescheduling</button></div></div></section><div class="bento-metric metric-classes"><div class="metric-top"><span class="metric-icon">▦</span><span class="metric-tag">THIS WEEK</span></div><div class="metric-value">${classes.length}</div><div class="metric-label">Classes on timetable</div><div class="metric-foot"><span class="metric-line"></span> Across your schedule</div></div><div class="bento-metric metric-scheduled"><div class="metric-top"><span class="metric-icon">↗</span><span class="metric-tag">ACTIVE</span></div><div class="metric-value">${upcoming}</div><div class="metric-label">Scheduled classes</div><div class="metric-foot">Ready to go</div></div><div class="bento-metric metric-notifications"><div class="metric-top"><span class="metric-icon">♧</span><span class="metric-tag">UPDATES</span></div><div class="metric-value">${unreadCount()}</div><div class="metric-label">Unread notifications</div><div class="metric-foot">${cancelled} cancelled · retained in history</div></div><section class="bento-next"><div class="bento-section-head"><div><span class="section-kicker">UP NEXT</span><h2>Your next scheduled class</h2></div><span class="mini-spark">✳</span></div>${next?`<div class="next-class"><div class="next-time"><strong>${next.start}</strong><span>to ${next.end}</span></div><div class="next-info"><strong>${esc(next.subject)}</strong><span>${esc(next.room)} <i>•</i> ${esc(next.section)}</span><small>${fmtDate(next.date)} · ${esc(next.teacher)}</small></div><span class="pill scheduled">Scheduled</span></div>`:`<div class="empty">No scheduled classes in this view.</div>`}<div class="next-bottom"><span>◉ ${roomCount} rooms in use across your schedule</span><span class="orange-dash"></span></div></section><section class="bento-week"><div class="week-top"><div><span class="section-kicker">TIMETABLE OVERVIEW</span><h2>Your week at a glance</h2><p>${fmtDate(dates[0])} — ${fmtDate(dates[5])}</p></div><div class="weekbtns"><button class="outline" id="prevWeek" aria-label="Previous week">←</button><button class="outline" id="thisWeek">This week</button><button class="outline" id="nextWeek" aria-label="Next week">→</button></div></div><div class="week-strip">${dates.map(d=>{let count=classes.filter(c=>c.date===d&&c.status==='Scheduled').length;return `<div class="week-day"><span>${dayName(d).slice(0,3)}</span><strong>${new Date(d+'T12:00:00').getDate()}</strong><div class="day-dots">${Array.from({length:Math.min(count,5)},()=>'<i></i>').join('')}</div><small>${count} class${count===1?'':'es'}</small></div>`}).join('')}</div></section><section class="panel bento-timetable"><div class="panelhead"><div><span class="section-kicker">DETAIL VIEW</span><h2>Weekly timetable</h2><p>Search and manage individual classes</p></div><div class="filters"><input class="search" id="searchSchedule" placeholder="Search subject, room…" value="${esc(state.search)}"><select class="filter" id="dayFilter"><option value="all">All days</option>${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map(d=>`<option ${state.filterDay===d?'selected':''}>${d}</option>`).join('')}</select></div></div>${classes.length?`<div class="schedule-list">${dates.map(d=>{let rows=classes.filter(c=>c.date===d);return rows.length?`<div class="daygroup"><div class="daytitle">${dayName(d)} <span style="color:#98a2b3;font-weight:500;letter-spacing:0">${fmtDate(d)}</span></div>${rows.map(classCard).join('')}</div>`:''}).join('')}</div>`:`<div class="empty">No classes match this week or filter.</div>`}</section><div class="footnote">Demo timetable for the six section groups; dates are anchored to the week of 19 October 2026. All demo IDs share changes in this browser.</div></div>`}
function classCard(c){let isTeacher=state.user.role==='teacher',canAct=isTeacher&&c.status!=='Cancelled'&&c.date>=baseDate;return `<article class="classcard"><div class="timebox">${esc(c.start)}<span>to ${esc(c.end)}</span></div><div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><div class="class-title">${esc(c.subject)}</div><span class="pill ${c.status.toLowerCase()}">${esc(c.status)}</span></div><div class="meta"><span>▣ ${esc(c.room)}</span><span>♙ ${esc(c.section)}</span><span>♧ ${esc(c.teacher)}</span></div>${c.status==='Rescheduled'&&c.history.length?`<div style="font-size:11px;color:var(--blue);margin-top:5px">Updated from ${esc(c.history[c.history.length-1].oldDate)} · ${esc(c.history[c.history.length-1].oldStart)} · ${esc(c.history[c.history.length-1].oldRoom)}</div>`:''}</div><div class="actions">${canAct?`<button class="danger small" data-cancel="${c.id}">Cancel</button><button class="primary small" data-reschedule="${c.id}">Reschedule</button>`:''}</div></article>`}
function matrixHTML(){let date=state.matrixDate;return `<div class="pagehead"><div><div class="eyebrow">Live timetable view</div><h1>Room availability</h1><p class="sub">Every room against every timetable slot. Occupied cells show the section using the room.</p></div></div><section class="panel"><div class="panelhead"><div><h2>Availability matrix</h2><p>Choose a date to inspect rooms and classes.</p></div><div class="datebar"><button class="outline" id="matrixPrev">←</button><input type="date" id="matrixDate" value="${date}"><button class="outline" id="matrixNext">→</button></div></div><div class="legend"><span><i class="dot free"></i>Free</span><span><i class="dot busy"></i>Occupied</span><span>Click an occupied cell for details.</span></div><div class="matrixwrap" style="margin-top:15px"><table class="matrix"><thead><tr><th>Room</th>${SLOTS.map(s=>`<th>${s.start}<br>${s.end}</th>`).join('')}</tr></thead><tbody>${ROOMS.map(room=>`<tr><td>${room}</td>${SLOTS.map(s=>{let cs=state.classes.filter(c=>active(c)&&c.date===date&&c.room===room&&overlaps(s,c));if(!cs.length)return `<td><div class="cell free">FREE</div></td>`;let c=cs[0];return `<td><div class="cell busy"><button data-cell="${c.id}" title="View class details">${esc(c.section)}<br>${esc(c.subject)}</button></div></td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="footnote">Room status is calculated from active classes and the selected date. Cancelled classes are excluded.</div></section>`}
function unreadCount(){return state.notifications.filter(n=>n.section===state.user?.section||n.teacherId===state.user?.id||n.audience==='all').filter(n=>!n.readBy?.includes(state.user?.id)).length}
function notificationsHTML(){let notes=state.notifications.filter(n=>state.user.role==='teacher'?(n.teacherId===state.user.id||n.audience==='all'):(n.section===state.user.section||n.audience==='all')).sort((a,b)=>b.createdAt-a.createdAt);return `<div class="pagehead"><div><div class="eyebrow">Stay up to date</div><h1>Notifications</h1><p class="sub">Class cancellations and rescheduling updates relevant to your account.</p></div><button class="outline" id="markAll">Mark all as read</button></div><section class="panel"><div class="notice-list">${notes.length?notes.map(n=>`<div class="notice ${!n.readBy?.includes(state.user.id)?'unread':''}"><div class="noticeicon">${n.type==='Cancelled'?'!':'↻'}</div><div style="flex:1"><strong>${esc(n.title)}</strong><p>${esc(n.message)}</p><small>${new Date(n.createdAt).toLocaleString()}</small></div>${!n.readBy?.includes(state.user.id)?`<button class="outline small" data-read="${n.id}">Mark read</button>`:''}</div>`).join(''):`<div class="empty">No notifications yet. Confirmed class changes will appear here.</div>`}</div></section>`}
function activityHTML(){let items=state.activity.slice().sort((a,b)=>b.createdAt-a.createdAt);return `<div class="pagehead"><div><div class="eyebrow">Audit trail</div><h1>Activity history</h1><p class="sub">A record of confirmed cancellations and rescheduling.</p></div></div><section class="panel"><div class="activity">${items.length?items.map(a=>`<div class="activityitem"><strong>${esc(a.title)}</strong><p>${esc(a.message)}</p><small style="color:#98a2b3">${new Date(a.createdAt).toLocaleString()}</small></div>`).join(''):`<div class="empty">No activity yet. Confirm a cancellation or reschedule to see it here.</div>`}</div></section>`}
function modalHTML(){let m=state.modal,c=state.classes.find(x=>x.id===m.classId);if(!c)return '';if(m.type==='cancel')return `<div class="modalback"><section class="modal"><h2>Cancel this class?</h2><p class="intro">Please review the details before confirming cancellation.</p><div class="detailbox"><div class="detailgrid"><div><span>Subject</span><strong>${esc(c.subject)}</strong></div><div><span>Section</span><strong>${esc(c.section)}</strong></div><div><span>Room</span><strong>${esc(c.room)}</strong></div><div><span>Date</span><strong>${fmtDate(c.date)}</strong></div><div><span>Time slot</span><strong>${slotLabel(c)}</strong></div><div><span>Teacher</span><strong>${esc(c.teacher)}</strong></div></div></div><div class="warning">This will cancel the class, free the room and time slot, and notify students in ${esc(c.section)}. This action is recorded in activity history.</div><div class="modalfoot"><button class="outline" data-close>Go Back</button><button class="danger" id="confirmCancel">Confirm Cancellation</button></div></section></div>`;
if(m.type==='reschedule') {let opts=m.date?getOptions(c,m.date):[];let selected=m.selected?opts.find(o=>o.start===m.selected.start&&o.end===m.selected.end&&o.room===m.selected.room):null;return `<div class="modalback"><section class="modal"><h2>Reschedule class</h2><p class="intro">Only valid room and time combinations are offered. The room, teacher, and student section must all be free.</p><div class="detailbox"><div class="detailgrid"><div><span>Subject</span><strong>${esc(c.subject)}</strong></div><div><span>Section</span><strong>${esc(c.section)}</strong></div><div><span>Teacher</span><strong>${esc(c.teacher)}</strong></div><div><span>Original date</span><strong>${fmtDate(c.date)}</strong></div><div><span>Original time</span><strong>${slotLabel(c)}</strong></div><div><span>Original room</span><strong>${esc(c.room)}</strong></div></div></div>${m.stage==='confirm'?`<div class="eyebrow" style="margin-top:18px">Confirm timetable change</div><div class="detailgrid" style="margin-top:10px"><div class="detailbox"><span>Original date</span><strong>${fmtDate(c.date)}</strong><div>${slotLabel(c)} · ${esc(c.room)}</div></div><div class="detailbox"><span>New date</span><strong>${fmtDate(m.selected.date)}</strong><div>${m.selected.start}–${m.selected.end} · ${esc(m.selected.room)}</div></div></div><div class="warning">Confirming will move this class. The original slot becomes available, and students in ${esc(c.section)} will receive a notification.</div><div class="modalfoot"><button class="outline" id="editReschedule">Go Back and Edit</button><button class="outline" data-close>Cancel Operation</button><button class="primary" id="confirmReschedule">Confirm Reschedule</button></div>`:`<div class="field" style="margin-top:18px"><label for="rescheduleDate">Select new date</label><input type="date" id="rescheduleDate" min="${baseDate}" value="${esc(m.date||addDays(c.date,1))}"></div>${m.date?`<div class="panelhead" style="margin-top:16px"><div><h2>Available time slots and rooms</h2><p>${fmtDate(m.date)} · ${opts.length} valid combinations</p></div></div>${opts.length?`<div class="choices">${opts.map(o=>`<button class="choice ${m.selected&&m.selected.start===o.start&&m.selected.room===o.room?'selected':''}" data-choice="${o.start}|${o.end}|${o.room}"><strong>${o.start}–${o.end}</strong><small>Room ${o.room} · Teacher and section free</small></button>`).join('')}</div>`:`<div class="warning">No valid rooms or time slots are available for this date. Please select another date.</div>`}`:''}<div class="modalfoot"><button class="outline" data-close>Cancel Operation</button><button class="primary" id="continueReschedule" ${selected?'':'disabled'}>Review Change →</button></div>`}</section></div>`}
return `<div class="modalback"><section class="modal"><h2>${esc(c.subject)}</h2><p class="intro">Class details</p><div class="detailbox">${fmtDate(c.date)} · ${slotLabel(c)} · ${esc(c.room)} · ${esc(c.section)}</div><div class="modalfoot"><button class="primary" data-close>Close</button></div></section></div>`}
function milestoneKey(){return 'campusslot_milestones_'+state.user.id}
function getMilestones(){try{return JSON.parse(localStorage.getItem(milestoneKey())||'{}')}catch(e){return {}}}
function setMilestone(key,val=true){let m=getMilestones();m[key]=val;localStorage.setItem(milestoneKey(),JSON.stringify(m));updateMilestoneUI()}
function updateMilestoneUI(){let m=getMilestones(),keys=['login','schedule','room','reschedule'],done=keys.filter(k=>m[k]).length;document.querySelectorAll('[data-milestone]').forEach(b=>b.classList.toggle('done',!!m[b.dataset.milestone]));document.querySelectorAll('[data-node]').forEach((n,i)=>n.classList.toggle('reached',i<done));let count=document.getElementById('milestoneCount');if(count)count.textContent=done+' of 4 milestones';let path=document.getElementById('milestonePath');if(path)path.style.strokeDashoffset=300-(300*done/4)}
function bindImmersiveControls(){document.querySelectorAll('[data-milestone]').forEach(b=>b.onclick=()=>{let key=b.dataset.milestone;setMilestone(key,!getMilestones()[key]);notify(getMilestones()[key]?'Milestone unlocked!':'Milestone reset.')});updateMilestoneUI()}
function bindApp(){document.getElementById('logout').onclick=()=>{state.user=null;state.modal=null;render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.modal=null;render()});document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{state.modal={type:'cancel',classId:b.dataset.cancel};render()});document.querySelectorAll('[data-reschedule]').forEach(b=>b.onclick=()=>{let c=state.classes.find(x=>x.id===b.dataset.reschedule);state.modal={type:'reschedule',classId:c.id,date:addDays(c.date,1),selected:null,stage:'choose'};let opts=getOptions(c,state.modal.date);state.modal.selected=opts[0]||null;render()});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{state.modal=null;render()});let p=document.getElementById('prevWeek');if(p)p.onclick=()=>{state.weekStart=addDays(state.weekStart,-7);render()};let n=document.getElementById('nextWeek');if(n)n.onclick=()=>{state.weekStart=addDays(state.weekStart,7);render()};let tw=document.getElementById('thisWeek');if(tw)tw.onclick=()=>{state.weekStart=weekStartFor(baseDate);render()};let search=document.getElementById('searchSchedule');if(search)search.oninput=()=>{let pos=search.selectionStart;state.search=search.value;let main=document.querySelector('.main');let y=window.scrollY;let html=dashboardHTML();main.innerHTML=html;bindDashboardOnly();window.scrollTo(0,y);let inp=document.getElementById('searchSchedule');if(inp){inp.focus();inp.setSelectionRange(pos,pos)}};let day=document.getElementById('dayFilter');if(day)day.onchange=()=>{state.filterDay=day.value;render()};let md=document.getElementById('matrixDate');if(md)md.onchange=()=>{state.matrixDate=md.value||baseDate;render()};let mp=document.getElementById('matrixPrev');if(mp)mp.onclick=()=>{state.matrixDate=addDays(state.matrixDate,-1);render()};let mn=document.getElementById('matrixNext');if(mn)mn.onclick=()=>{state.matrixDate=addDays(state.matrixDate,1);render()};document.querySelectorAll('[data-cell]').forEach(b=>{b.onclick=()=>{state.modal={type:'details',classId:b.dataset.cell};render()}});document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{let n=state.notifications.find(x=>x.id===b.dataset.read);if(n){n.readBy=[...(n.readBy||[]),state.user.id];save();render()}});let ma=document.getElementById('markAll');if(ma)ma.onclick=()=>{state.notifications.forEach(n=>{if(state.user.role==='teacher'?(n.teacherId===state.user.id||n.audience==='all'):(n.section===state.user.section||n.audience==='all'))n.readBy=[...new Set([...(n.readBy||[]),state.user.id])]});save();render()};bindModal();bindImmersiveControls();setMilestone('login',true)}
function bindDashboardOnly(){document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{state.modal={type:'cancel',classId:b.dataset.cancel};render()});document.querySelectorAll('[data-reschedule]').forEach(b=>b.onclick=()=>{let c=state.classes.find(x=>x.id===b.dataset.reschedule);state.modal={type:'reschedule',classId:c.id,date:addDays(c.date,1),selected:null,stage:'choose'};let opts=getOptions(c,state.modal.date);state.modal.selected=opts[0]||null;render()});let p=document.getElementById('prevWeek');if(p)p.onclick=()=>{state.weekStart=addDays(state.weekStart,-7);render()};let n=document.getElementById('nextWeek');if(n)n.onclick=()=>{state.weekStart=addDays(state.weekStart,7);render()};let tw=document.getElementById('thisWeek');if(tw)tw.onclick=()=>{state.weekStart=weekStartFor(baseDate);render()};let day=document.getElementById('dayFilter');if(day)day.onchange=()=>{state.filterDay=day.value;render()}}
function bindModal(){if(!state.modal)return;let m=state.modal;if(m.type==='cancel'){let b=document.getElementById('confirmCancel');if(b)b.onclick=()=>{let c=state.classes.find(x=>x.id===m.classId);if(!c||c.status==='Cancelled')return;let old={date:c.date,start:c.start,end:c.end,room:c.room};c.status='Cancelled';c.history.push({action:'Cancelled',oldDate:old.date,oldStart:old.start,oldEnd:old.end,oldRoom:old.room,at:Date.now()});state.notifications.push({id:cryptoId(),type:'Cancelled',title:'Class cancelled: '+c.subject,message:`${c.subject} for ${c.section} on ${fmtDate(c.date)} at ${slotLabel(c)} in ${c.room} has been cancelled by ${c.teacher}.`,section:c.section,teacherId:c.teacherId,createdAt:Date.now(),readBy:[]});state.activity.push({createdAt:Date.now(),title:'Class cancelled · '+c.subject,message:`${c.section} · ${fmtDate(c.date)} · ${slotLabel(c)} · ${c.room}. Room slot released.`});save();state.modal=null;render();notify('Class cancelled. Room freed and students notified.')}}
if(m.type==='reschedule'){let dateInput=document.getElementById('rescheduleDate');if(dateInput)dateInput.onchange=()=>{m.date=dateInput.value;m.selected=null;let c=state.classes.find(x=>x.id===m.classId),opts=getOptions(c,m.date);m.selected=opts[0]||null;render()};document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let [start,end,room]=b.dataset.choice.split('|');m.selected={date:m.date,start,end,room};render()});let cont=document.getElementById('continueReschedule');if(cont)cont.onclick=()=>{let c=state.classes.find(x=>x.id===m.classId);if(!m.selected||!getOptions(c,m.date).some(o=>o.start===m.selected.start&&o.end===m.selected.end&&o.room===m.selected.room)){notify('That slot is no longer available.');m.selected=null;render();return}m.stage='confirm';render()};let edit=document.getElementById('editReschedule');if(edit)edit.onclick=()=>{m.stage='choose';render()};let conf=document.getElementById('confirmReschedule');if(conf)conf.onclick=()=>{let c=state.classes.find(x=>x.id===m.classId),o=m.selected;if(!c||!o)return;let fresh=getOptions(c,o.date).some(x=>x.start===o.start&&x.end===o.end&&x.room===o.room);if(!fresh){notify('Conflict detected. Choose another slot.');m.stage='choose';m.selected=null;render();return}let old={date:c.date,start:c.start,end:c.end,room:c.room};c.history.push({action:'Rescheduled',oldDate:old.date,oldStart:old.start,oldEnd:old.end,oldRoom:old.room,newDate:o.date,newStart:o.start,newEnd:o.end,newRoom:o.room,at:Date.now()});c.date=o.date;c.start=o.start;c.end=o.end;c.room=o.room;c.status='Rescheduled';state.notifications.push({id:cryptoId(),type:'Rescheduled',title:'Class rescheduled: '+c.subject,message:`${c.subject} for ${c.section} moved from ${fmtDate(old.date)} ${old.start}–${old.end} in ${old.room} to ${fmtDate(c.date)} ${slotLabel(c)} in ${c.room}.`,section:c.section,teacherId:c.teacherId,createdAt:Date.now(),readBy:[]});state.activity.push({createdAt:Date.now(),title:'Class rescheduled · '+c.subject,message:`${c.section}: ${fmtDate(old.date)} ${old.start}–${old.end} ${old.room} → ${fmtDate(c.date)} ${slotLabel(c)} ${c.room}.`});save();setMilestone('reschedule',true);state.matrixDate=c.date;state.weekStart=weekStartFor(c.date);state.modal=null;render();notify('Class rescheduled. Timetable and matrix updated; students notified.')}}}
function cryptoId(){return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

// Interactive 3D voxel field: perspective cubes rotate subtly and react to pointer movement.
(function(){
 const canvas=document.getElementById('ambient-cubes'); if(!canvas)return;
 const ctx=canvas.getContext('2d'); let w=0,h=0,dpr=1,mouse={x:-9999,y:-9999},target={x:0,y:0},cubes=[];
 const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);w=innerWidth;h=innerHeight;
  canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
  cubes=[];const step=w<700?78:64;
  for(let y=-step;y<h+step;y+=step){for(let x=-step;x<w+step;x+=step){cubes.push({x:x+Math.random()*step*.5,y:y+Math.random()*step*.5,z:.25+Math.random()*.9,size:9+Math.random()*12,phase:Math.random()*6.28,rot:Math.random()*6.28,depth:Math.random()});}}
 }
 function pointer(e){mouse.x=e.clientX;mouse.y=e.clientY;target.x=(e.clientX/w-.5)*2;target.y=(e.clientY/h-.5)*2}
 addEventListener('resize',resize);addEventListener('pointermove',pointer,{passive:true});addEventListener('pointerleave',()=>{mouse.x=-9999;mouse.y=-9999;target.x=target.y=0});
 function projectCube(c,t,login){
  const parallaxX=target.x*(18+c.z*22),parallaxY=target.y*(12+c.z*16);
  const x=c.x+parallaxX+Math.sin(t*.00035+c.phase)*8;
  const y=c.y+parallaxY+Math.cos(t*.0003+c.phase)*7;
  const dx=x-mouse.x,dy=y-mouse.y,dist=Math.hypot(dx,dy),radius=login?150:120;
  const voidness=Math.max(0,1-dist/radius);if(voidness>.94)return;
  const size=c.size*(.65+c.z*.75)*(1+Math.sin(t*.0007+c.phase)*.08)*(1-voidness*.55);
  const angle=c.rot+(reduced?0:t*.00018*(c.depth>.5?1:-1));
  // 3D cube vertices: rotate in 3D, then project with perspective.
  const verts=[];for(let i=0;i<8;i++){
   let vx=(i&1?1:-1),vy=(i&2?1:-1),vz=(i&4?1:-1);
   let x1=vx*Math.cos(angle)-vz*Math.sin(angle),z1=vx*Math.sin(angle)+vz*Math.cos(angle);
   let y1=vy*Math.cos(angle*.72)-z1*Math.sin(angle*.72),z2=vy*Math.sin(angle*.72)+z1*Math.cos(angle*.72);
   const perspective=1/(1+z2*.16);verts.push([x+x1*size*perspective,y+y1*size*perspective,z2]);
  }
  const edges=[[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]];
  const alpha=(.10+c.z*.12)*(1-voidness*.9)*(login?1:.85);
  ctx.strokeStyle=c.depth>.66?'#f97316':'#a85a2a';ctx.lineWidth=c.depth>.66?1.25:.8;ctx.globalAlpha=alpha;
  ctx.beginPath();for(const [a,b] of edges){ctx.moveTo(verts[a][0],verts[a][1]);ctx.lineTo(verts[b][0],verts[b][1]);}ctx.stroke();
  // Warm glow on the front-facing corner gives the cubes depth without obscuring text.
  if(c.depth>.72&&voidness<.5){ctx.globalAlpha=alpha*.8;ctx.fillStyle='#ff8a35';ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fill();}
 }
 function draw(t){ctx.clearRect(0,0,w,h);const login=!!document.querySelector('.loginpage');for(const c of cubes)projectCube(c,t,login);ctx.globalAlpha=1;requestAnimationFrame(draw)}
 resize();requestAnimationFrame(draw);
})();

// Scroll-in reveals + subtle pointer parallax/tilt and zoom on freshly rendered pages.
(function(){
 const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const targets='.bento-hero,.bento-metric,.bento-next,.bento-week,.bento-timetable,.stat,.panel,.classcard,.notice,.matrixwrap,.activityitem';
 let observer=null;
 function enhance(root){
  if(!root||reduce)return;
  if(observer)observer.disconnect();
  observer=new IntersectionObserver(entries=>entries.forEach(e=>{
   if(e.isIntersecting){e.target.classList.add('motion-visible');observer.unobserve(e.target)}
  }),{threshold:.08,rootMargin:'0px 0px -24px 0px'});
  root.querySelectorAll(targets).forEach((el,i)=>{
   if(el.dataset.motionReady)return;el.dataset.motionReady='1';el.classList.add('motion-reveal');el.style.transitionDelay=(Math.min(i%5,4)*45)+'ms';observer.observe(el);
   el.addEventListener('pointermove',e=>{
    if(e.pointerType==='touch')return;
    const r=el.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5;const y=(e.clientY-r.top)/r.height-.5;
    if(el.matches('.bento-hero,.bento-metric,.bento-next,.bento-week,.stat'))el.style.transform=`perspective(1000px) rotateX(${(-y*3).toFixed(2)}deg) rotateY(${(x*4).toFixed(2)}deg) translateY(-2px) translateZ(3px) scale(1.008)`;el.style.boxShadow=`${(-x*4).toFixed(1)}px ${(6-y*3).toFixed(1)}px 18px #f9731618,0 0 0 1px #f973160c`;el.style.filter='saturate(1.12)';
   });
   el.addEventListener('pointerleave',()=>{el.style.transform='';el.style.boxShadow='';el.style.filter=''});
  });
  const main=root.querySelector('.main');if(main){main.classList.remove('motion-zoom-in');void main.offsetWidth;main.classList.add('motion-zoom-in')}
 }
 document.addEventListener('DOMContentLoaded',()=>enhance(document));
 const app=document.getElementById('app')||document.body;
 new MutationObserver(()=>enhance(document)).observe(app,{childList:true,subtree:true});
 enhance(document);
})();


// 3D card interaction inspired by the supplied CardContainer/CardItem example.
// Visual-only enhancement: no schedule, login, or booking logic is changed.
(()=>{
 const selectors='.bento-hero,.bento-metric,.bento-next,.bento-week,.bento-timetable,.stat,.panel,.classcard,.notice,.matrixwrap';
 document.addEventListener('pointermove',e=>{
   if(e.pointerType==='touch')return;
   const card=e.target.closest(selectors); if(!card)return;
   const r=card.getBoundingClientRect(); if(!r.width||!r.height)return;
   const px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
   const rx=(.5-py)*4, ry=(px-.5)*5;
   card.style.transform=`perspective(1100px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) translateY(-2px) translateZ(3px) scale(1.008)`;
   card.style.boxShadow=`${(ry*.35).toFixed(1)}px ${Math.max(4,6-rx*.15).toFixed(1)}px 18px #f9731618,0 0 0 1px #f973160c`;
   card.style.filter='saturate(1.02)';
 },{passive:true});
 document.addEventListener('pointerout',e=>{
   const card=e.target.closest(selectors); if(!card||card.contains(e.relatedTarget))return;
   card.style.transform='';card.style.boxShadow='';card.style.filter='';
 },{passive:true});
})();
